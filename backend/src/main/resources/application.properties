spring.application.name=backend

server.port=${PORT:8080}

# Database
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:180000}
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=${DB_CONNECT_TIMEOUT:20000}
spring.datasource.hikari.initialization-fail-timeout=-1

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=planmate
spring.flyway.default-schema=planmate

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=${REDIS_TIMEOUT:3s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:5s}
spring.cache.type=redis

management.endpoint.health.probes.enabled=true
# Defines a new endpoint, /actuator/health/live, that only checks "is the JVM itself alive and does it have disk space"
management.endpoint.health.group.live.include=ping,diskSpace
# Keeps that endpoint's response minimal
management.endpoint.health.group.live.show-details=never
management.health.redis.enabled=${HEALTH_REDIS_ENABLED:true}

# Swagger - enabled locally; set SWAGGER_ENABLED=false in production.
# http://localhost:8080/swagger-ui/index.html
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# Keycloak Resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWK_SET_URI}
jwt.auth.converter.resource-id=planmate-backend
jwt.auth.converter.principle-attribute=sub

# Keycloak
keycloak.auth-server-url=${KEYCLOAK_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.scope=openid profile email

#Front-end
frontend.url=${FRONTEND_URL}

# Logging
logging.level.org.springframework.web.socket=WARN
